name: CI/CD - Test, Build, and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: near-earth-asteroid-predictor
  IMAGE: near-earth-asteroid-predictor
  SERVICE: near-earth-asteroid-predictor
  REGION: us-central1
  ARTIFACT_BUCKET: gs://project-3e6b348d-e2ae-4a47-9af_cloudbuild/artifacts

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure Docker to use gcloud as credential helper
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Download model artifacts from GCS
      run: |
        mkdir -p artifacts
        gcloud storage cp "${{ env.ARTIFACT_BUCKET }}/model_pha.pkl" ./artifacts/
        gcloud storage cp "${{ env.ARTIFACT_BUCKET }}/columntransformer_pha.pkl" ./artifacts/
        gcloud storage cp "${{ env.ARTIFACT_BUCKET }}/model_moid.pkl" ./artifacts/
        gcloud storage cp "${{ env.ARTIFACT_BUCKET }}/columntransformer_moid.pkl" ./artifacts/
        

    
    - name: Build Docker image
      run: |
        docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
                     .

    - name: Tag main branch image as latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
                   "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

    - name: Push Docker image to Artifact Registry
      if: github.event_name == 'push'
      run: |
        docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"

    - name: Push latest tag for main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy "${{ env.SERVICE }}" \
          --image "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
          --platform managed \
          --region "${{ env.REGION }}" \
          --project "${{ env.PROJECT_ID }}" \
          --allow-unauthenticated
          --set-env-vars INFERENCE_LOG_BUCKET="$MONITORING_BUCKET"

    - name: Show deployed service URL
      run: |
        gcloud run services describe "${{ env.SERVICE }}" \
          --platform managed \
          --region "${{ env.REGION }}" \
          --project "${{ env.PROJECT_ID }}" \
          --format='value(status.url)'
