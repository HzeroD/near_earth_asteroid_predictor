[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "near_earth_asteroid_predictor"
version = "0.1.0"
description = "Predictions for Potentially Hazardous Asteroid and Minimum Orbit Intersection Distance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.131.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.41.0",
    "dill>=0.4.1",
    "google-cloud-bigquery>=3.39.0",
    "google-cloud-storage>=3.7.0",
    "gsutil==5.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
